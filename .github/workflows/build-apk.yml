name: Build Sproing APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sproing-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish as a release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Sproing.apk
          gh release create "build-${{ github.run_number }}" Sproing.apk \
            --title "Sproing build ${{ github.run_number }}" \
            --notes "Sideloadable Android APK (landscape, fully offline)."
