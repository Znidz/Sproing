plugins {
    id 'com.android.application'
}

android {
    namespace 'com.znidz.sproing'
    compileSdk 34

    defaultConfig {
        applicationId "com.znidz.sproing"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the auto-generated debug key so the APK installs directly (sideloading).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
